<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="70%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base canvas fill -->
  <rect width="512" height="512" rx="112" fill="#020617" />

  <!-- Warm ambient glow around card border -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#f59e0b" stroke-width="16" opacity="0.28" filter="url(#glow)" />

  <!-- Outer rounded container -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="26" stroke-linejoin="round" />

  <!-- Flame Icon -->
  <g transform="translate(100, 98) scale(13)">
    <!-- Outer ambient flame glow -->
    <path
      d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
      fill="none"
      stroke="#d97706"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.4"
    />
    <!-- Crisp golden flame contour -->
    <path
      d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
      fill="none"
      stroke="#fbbf24"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>