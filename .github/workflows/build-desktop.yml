name: Build Windows & Linux Desktop Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows .EXE
        run: npx @nativefier/nativefier "https://ddo-multi-tool-assistant.onrender.com/" --name "DDON-Multi-Tool-Assistant" --platform windows --arch x64 --out dist-desktop

      - name: Upload Windows .EXE
        uses: actions/upload-artifact@v4
        with:
          name: DDON-Assistant-Windows-exe
          path: dist-desktop/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Package Linux Binary (.AppImage / deb)
        run: npx @nativefier/nativefier "https://ddo-multi-tool-assistant.onrender.com/" --name "DDON-Multi-Tool-Assistant" --platform linux --arch x64 --out dist-desktop

      - name: Upload Linux App
        uses: actions/upload-artifact@v4
        with:
          name: DDON-Assistant-Linux-App
          path: dist-desktop/
