name: Build Windows & Linux Desktop Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Nativefier Packager
        run: npm install -g nativefier

      - name: Package Windows .EXE
        run: nativefier "https://ddo-multi-tool-assistant.onrender.com/" --name "DDON-Multi-Tool-Assistant" --platform windows --arch x64 --single-instance --out dist-desktop

      - name: Upload Windows .EXE
        uses: actions/upload-artifact@v4
        with:
          name: DDON-Assistant-Windows-x64
          path: dist-desktop/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Nativefier Packager
        run: sudo npm install -g nativefier

      - name: Package Linux Binary
        run: nativefier "https://ddo-multi-tool-assistant.onrender.com/" --name "DDON-Multi-Tool-Assistant" --platform linux --arch x64 --single-instance --out dist-desktop

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: DDON-Assistant-Linux-x64
          path: dist-desktop/
